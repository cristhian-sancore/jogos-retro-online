<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - SNES Web</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 10vh auto;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            text-align: center;
        }
        .auth-container h2 { margin-bottom: 1.5rem; color: var(--primary-color); }
        .auth-container input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(255,255,255,0.1);
            color: white;
            font-family: inherit;
        }
        .auth-container button {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .auth-container button:hover { background: var(--primary-hover); }
        .flash { color: #f87171; margin-bottom: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Criar Conta</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data">
            <input type="text" name="full_name" placeholder="Nome Completo" required>
            <input type="date" name="birthdate" placeholder="Data de Nascimento" required style="color: rgba(255,255,255,0.7);">
            <input type="email" name="email" placeholder="E-mail" required>
            <input type="text" name="username" placeholder="Nome de usuário (Apelido)" required>
            <input type="password" name="password" placeholder="Senha" required>
            <div style="text-align: left; margin-bottom: 5px; font-size: 0.9em; color: rgba(255,255,255,0.8);">Foto de Perfil (Opcional):</div>
            <input type="file" name="avatar" accept="image/*" style="padding: 10px; border: 1px dashed rgba(255,255,255,0.3); cursor: pointer;">
            <button type="submit">Cadastrar</button>
        </form>
        <p style="margin-top: 15px; font-size: 0.9rem;">
            Já tem conta? <a href="{{ url_for('login') }}" style="color: #818cf8;">Fazer Login</a>
        </p>
    </div>
</body>
</html>
