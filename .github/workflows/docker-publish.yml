name: Build and Publish Docker Images

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # A imagem principal do painel
  IMAGE_NAME_WEB: ${{ github.repository }}-web
  # A imagem do servidor multiplayer
  IMAGE_NAME_NETPLAY: ${{ github.repository }}-netplay

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build e Push do SNES Web (Flask)
      - name: Extract metadata for Web
        id: meta-web
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}

      - name: Build and push Web Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

      # Build e Push do Netplay Server (Rust)
      - name: Extract metadata for Netplay
        id: meta-netplay
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_NETPLAY }}

      - name: Build and push Netplay Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.netplay
          push: true
          tags: ${{ steps.meta-netplay.outputs.tags }}
          labels: ${{ steps.meta-netplay.outputs.labels }}
